# Builds RedFilter on every push and pull request, and publishes a downloadable Windows executable.
#
#   - Every run: tests, then a self-contained single-file RedFilter.exe (no .NET install needed),
#     uploaded as the "RedFilter-win-x64" artifact on the run's page (Actions tab).
#   - A tag like v1.2.0: the same build, attached to a GitHub Release named after the tag.
#
#     git tag v1.2.0
#     git push origin v1.2.0
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = "1.0.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tags must look like v1.2.3 (got '$env:GITHUB_REF_NAME')." }
          "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version $version"

      - name: Test
        run: dotnet test tests/RedFilter.Core.Tests -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Publish RedFilter.exe
        run: >
          dotnet publish src/RedFilter.App/RedFilter.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/RedFilter.exe "dist/RedFilter-$env:VERSION-win-x64.exe"
          Compress-Archive -Path publish/*, README.md -DestinationPath "dist/RedFilter-$env:VERSION-win-x64.zip" -Force
          Get-FileHash dist/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: RedFilter-win-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RedFilter-win-x64
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Descarga `RedFilter-…-win-x64.exe` y ejecútalo: no hace falta instalar .NET.
            Windows SmartScreen puede avisar porque el ejecutable no está firmado: "Más información" > "Ejecutar de todas formas".
